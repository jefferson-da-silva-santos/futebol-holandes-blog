    <meta name="keywords" content="futebol holandês, eredivisie, seleção holandesa, PSV Eindhoven, Ajax Amsterdam, Feyenoord, AZ Alkmaar, FC Twente, NEC Nijmegen, Heerenveen, Go Ahead Eagles, Sparta Rotterdam, NAC Breda, Heracles Almelo, FC Utrecht, Fortuna Sittard, Groningen, nations league holanda, futebol países baixos, holanda futebol, liga holandesa, campeonato holandês, eredivisie 2025, eredivisie 2026, classificação eredivisie, artilheiros eredivisie, Virgil van Dijk, Frenkie de Jong, Memphis Depay, Cody Gakpo, Xavi Simons, Ryan Gravenberch, Jurriën Timber, Nathan Aké, Denzel Dumfries, Robin van Persie, Patrick Kluivert, Ronald Koeman, Peter Bosz, transferências eredivisie, gols eredivisie, resultados eredivisie, tabela eredivisie, seleção orange, oranje, ajax campeão, psv campeão, feyenoord champions, europa league holanda, champions league holanda, KNVB, futebol holandês em português, notícias futebol holanda, holanda copa do mundo, eurocopa holanda, futebol pt-br holanda" />
    <meta name="author" content="Futebol Holandês" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FF6200" />
    <meta name="color-scheme" content="light" />

    <!-- ── Favicon & Ícones ────────────────────────────────────────────────── -->
    <link rel="shortcut icon" href="/logo.png" type="image/x-icon" />

    <!-- ── Open Graph (Facebook, WhatsApp, LinkedIn, Telegram) ────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Futebol Holandês" />
    <meta property="og:title" content="Futebol Holandês | Tudo sobre o futebol da Holanda em português" />
    <meta property="og:description" content="Acompanhe as últimas notícias da Eredivisie, Seleção Holandesa, Nations League e muito mais. O melhor do futebol dos Países Baixos em português." />
    <meta property="og:url" content="https://futebolholandes.blog.br/" />

    <meta property="og:image:alt" content="Logo Futebol Holandês" />

    <!-- ── Twitter Card ────────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Futebol Holandês | Tudo sobre o futebol da Holanda em português" />

    <meta name="twitter:image:alt" content="Logo Futebol Holandês" />

    <!-- ── Canonical ───────────────────────────────────────────────────────── -->
    <!-- Domínio real do deploy (ver .github/workflows/deploy.yml) — o valor
         anterior aqui ("futebolholandes.com.br") apontava pro domínio errado,
         o que confundia o Google sobre qual é a URL "oficial" do site. -->
    <link rel="canonical" href="https://futebolholandes.blog.br/" />

    <!-- ── Preconnect (performance) ────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" />

    <!-- ── Preload críticos ─────────────────────────────────────────────────── -->
    <link rel="preload" href="/logo.png" as="image" />

    <!-- ── Dados estruturados (JSON-LD) ─────────────────────────────────────── -->
    <!-- NewsMediaOrganization é o tipo schema.org mais específico pra um site
         de notícias — ajuda o Google a entender que isso é um veículo de
         imprensa, não uma empresa/loja qualquer. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NewsMediaOrganization",
        "name": "Futebol Holandês",
        "alternateName": "Futebol Holandês Blog",
        "description": "Portal de notícias sobre o futebol da Holanda em português: Eredivisie, Seleção Holandesa, Nations League, transferências e resultados.",
        "url": "https://futebolholandes.blog.br/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://futebolholandes.blog.br/logo.png"
        },
        "sameAs": []
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Futebol Holandês",
        "url": "https://futebolholandes.blog.br/",
        "inLanguage": "pt-BR"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
